# -----------------------------------------------------------------------------
# Cut a new release — entirely from the GitHub UI, no local tooling needed.
#
# In GitHub: Actions -> Release -> "Run workflow" -> pick patch / minor / major.
#
# What it does, in one run:
#   1. computes the next semver from `package.json` (npm version rules);
#   2. writes it into `package.json`, `package-lock.json` AND the manifest
#      (`gladys-assistant-integration.json`: both `version` and the
#      `docker_image` tag, so the indexer and the image stay in lockstep);
#   3. moves the "Unreleased" section of CHANGELOG.md under the new version
#      (the release is refused when that section is empty);
#   4. commits the bump and pushes it together with the `vX.Y.Z` tag (one
#      atomic push: both land or neither does), then publishes the GitHub
#      Release with that changelog section as its notes (plus GitHub's list of
#      merged pull requests);
#   5. calls build.yml to publish the multi-arch image (`:X.Y.Z` + `:latest`).
#
# Why call build.yml instead of relying on the tag push: a tag pushed with the
# default GITHUB_TOKEN does NOT trigger other workflows, so we invoke the build
# ourselves. No personal access token to create.
#
# `resume` finishes a release interrupted after its version commit (tag,
# GitHub Release or image missing): it bumps nothing, tags the
# "chore(release): X.Y.Z" commit of the version already in package.json if
# the tag is missing, creates the GitHub Release if missing, and builds.
# -----------------------------------------------------------------------------
name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Version bump for this release'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - resume

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the version bump, push the tag, create the release
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bump version and update the manifest
        id: bump
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_TYPE" = "resume" ]; then
            version="$(jq -r .version package.json)"
            manifest_version="$(jq -r .version gladys-assistant-integration.json)"
            if [ "$version" != "$manifest_version" ]; then
              echo "::error::package.json (${version}) and the manifest (${manifest_version}) disagree"
              exit 1
            fi
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # npm computes the next semver and writes it to package.json (and
          # package-lock.json). --no-git-tag-version: we own the commit + tag
          # below, so npm must not touch git.
          new_version="$(npm version "$RELEASE_TYPE" --no-git-tag-version | tail -n1)"
          new_version="${new_version#v}" # v1.2.0 -> 1.2.0

          image="ghcr.io/${GITHUB_REPOSITORY,,}:${new_version}"

          # Keep the manifest in lockstep: the version the indexer reads AND the
          # image tag Gladys pulls must both point at this release.
          tmp="$(mktemp)"
          jq --arg version "$new_version" --arg image "$image" \
            '.version = $version | .docker_image = $image' \
            gladys-assistant-integration.json > "$tmp"
          mv "$tmp" gladys-assistant-integration.json

          # jq expands short arrays over multiple lines; re-run prettier so the
          # committed manifest keeps passing `npm run format:check` on CI.
          npx --yes prettier@3 --write gladys-assistant-integration.json

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"

      # Fails (before anything is pushed) when the Unreleased section is empty:
      # every pull request adds its user-facing changes there.
      - name: Move the Unreleased changelog section under the new version
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          set -euo pipefail
          if [ "$RELEASE_TYPE" = "resume" ]; then
            # Already released: only read its notes back.
            node scripts/release-changelog.mjs --notes "$VERSION" "$RUNNER_TEMP/release-notes.md"
            exit 0
          fi
          node scripts/release-changelog.mjs "$VERSION" "$RUNNER_TEMP/release-notes.md"
          npx --yes prettier@3 --write CHANGELOG.md

      # Note: if the branch you release from is protected against direct pushes,
      # GitHub rejects the push below (the default GITHUB_TOKEN cannot bypass
      # branch protection). Allow GitHub Actions to bypass the rule, or release
      # from an unprotected branch.
      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="v${VERSION}"

          # Retry a push up to 3 times (a transient failure once left a version
          # commit on master without its tag, 1.22.0).
          # git's own error is surfaced as an annotation (readable from the
          # API, unlike the raw log).
          push() {
            for attempt in 1 2 3; do
              if out="$(git push "$@" 2>&1)"; then
                echo "$out"
                return 0
              fi
              echo "$out"
              echo "::warning::push failed (attempt ${attempt}/3): $(echo "$out" | tail -n 4 | tr '\n' ' ')"
              sleep $((attempt * 10))
            done
            return 1
          }

          if [ "$RELEASE_TYPE" = "resume" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
              echo "Tag ${tag} already exists."
              exit 0
            fi
            commit="$(git log --format=%H -1 --grep="^chore(release): ${VERSION}\$")"
            if [ -z "$commit" ]; then
              echo "::error::no \"chore(release): ${VERSION}\" commit to tag"
              exit 1
            fi
            git tag -a "$tag" -m "Release ${VERSION}" "$commit"
            if ! push origin "refs/tags/${tag}"; then
              # Fallback through the REST API (a lightweight tag on the same
              # commit): another path than the git protocol.
              echo "::warning::git push of ${tag} failed, creating it through the API"
              GH_TOKEN="${{ github.token }}" gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
                -f ref="refs/tags/${tag}" -f sha="$commit"
            fi
            exit 0
          fi

          git add package.json package-lock.json gladys-assistant-integration.json CHANGELOG.md
          git commit -m "chore(release): ${VERSION}"
          git tag -a "$tag" -m "Release ${VERSION}"

          # Atomic: the version commit and its tag land together or not at all.
          push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/${tag}"

      - name: Publish the GitHub Release
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            echo "GitHub Release v${VERSION} already exists."
            exit 0
          fi
          # The changelog section first, then GitHub's generated list of the
          # merged pull requests and the full-diff link.
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes \
            --verify-tag

  # Build and publish the image for the version we just tagged.
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.prepare.outputs.version }}
